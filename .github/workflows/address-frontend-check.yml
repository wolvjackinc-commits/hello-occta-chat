name: Address Frontend Fast Check

on:
  push:
    branches:
      - 'fix/address-checker-live-fallback-20260908'
    paths:
      - 'src/contexts/AvailabilityContext.tsx'
      - 'src/components/home/HeroSection.tsx'
      - '.github/workflows/address-frontend-check.yml'

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci --no-audit --no-fund
      - run: npm run typecheck
      - run: npm run build
