name: Apply Contract Acceptance Retry Hotfix V2

on:
  push:
    branches:
      - hotfix/contract-acceptance-retry-2026-10-08
    paths:
      - .github/workflows/apply-contract-acceptance-retry-hotfix-v2.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: hotfix/contract-acceptance-retry-2026-10-08

      - name: Patch source
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path
          import re

          # Backend acceptance retry safety.
          p = Path("supabase/functions/accept-contract-summary/index.ts")
          s = p.read_text()
          marker = "// Idempotency: already accepted — return existing acceptance + cert ref."
          if s.count(marker) != 1:
              raise SystemExit(f"idempotency marker count={s.count(marker)}")
          start = s.index(marker)
          release_marker = "  const releaseBlock = await consumerContractReleaseBlockForDb"
          end = s.index(release_marker, start)
          block = s[start:end].rstrip()
          s = s[:start] + s[end:]

          anchor = '  if (!cs) return jsonResponse({ error: "not_found" }, 404);'
          if anchor not in s:
              raise SystemExit("not-found anchor missing")
          s = s.replace(
              anchor,
              anchor + "\n\n  // Retry safety: a successful first acceptance consumes the one-time OTP.\n"
              "  // If the browser loses that response, return immutable accepted state before OTP replay checks.\n  "
              + block,
              1,
          )

          old_select = '.select("id, quote_id, contract_summary_id, contract_accepted_at, contract_acceptance_id, status, current_step")'
          new_select = '.select("id, quote_id, contract_summary_id, contract_accepted_at, contract_acceptance_id, status, current_step, journey_version, checkout_session_id")'
          if old_select not in s:
              raise SystemExit("journey select anchor missing")
          s = s.replace(old_select, new_select, 1)

          accept_anchor = "    contract_information_pack_template_version: currentCip?.template_version ?? null,\n"
          if accept_anchor not in s:
              raise SystemExit("acceptance insert anchor missing")
          s = s.replace(
              accept_anchor,
              accept_anchor
              + "    journey_version: journey?.journey_version ?? null,\n"
              + "    checkout_session_id: journey?.checkout_session_id ?? null,\n",
              1,
          )
          p.write_text(s)

          # Frontend recovery after a committed acceptance + lost HTTP response.
          p = Path("src/pages/quote/journey/AgreementStep.tsx")
          s = p.read_text()
          anchor = '''      if (error || (data as any)?.error) {
                  toast({'''
          if anchor not in s:
              raise SystemExit("AgreementStep error anchor missing")
          replacement = '''      if (error || (data as any)?.error) {
                  // The database commit is authoritative. Recover a completed signature
                  // if the HTTP response was lost instead of showing a false failure.
                  const recovered = await loadDetail();
                  if (recovered?.accepted_at) {
                    setAcceptedAt(recovered.accepted_at);
                    setCertificate(
                      recovered.certificate
                        ? { number: recovered.certificate.number, signed_url: recovered.certificate.signed_url }
                        : null,
                    );
                    toast({ title: "Contract accepted", description: "Next, set up your Direct Debit. Nothing is taken today." });
                    onAccepted();
                    return;
                  }
                  toast({'''
          s = s.replace(anchor, replacement, 1)
          p.write_text(s)

          # Journey 2 operational state sync; never mutate append-only acceptance evidence.
          p = Path("supabase/functions/journey2-apply-postcontract/index.ts")
          s = p.read_text()
          old = '.select("id, quote_id, current_step, status, contract_accepted_at, preferred_start_date, payment_method, billing_anchor_day, earliest_selectable_start_date")'
          new = '.select("id, quote_id, contract_summary_id, contract_acceptance_id, current_step, status, contract_accepted_at, preferred_start_date, payment_method, billing_anchor_day, earliest_selectable_start_date")'
          if old not in s:
              raise SystemExit("postcontract journey select anchor missing")
          s = s.replace(old, new, 1)

          s, n = re.subn(
              r'\n\s*await supabase\.from\("contract_acceptances"\)\n\s*\.update\(\{ journey_version: "v2", checkout_session_id: session\.checkout_session_id \}\)\n\s*\.eq\("quote_id", journey\.quote_id\)\n\s*\.is\("checkout_session_id", null\);\n',
              "\n",
              s,
          )
          if n != 2:
              raise SystemExit(f"expected 2 immutable acceptance update blocks, found {n}")

          billing_anchor = '''        status: "contract_accepted",
                  current_step: "billing",
                  post_contract_applied_at: new Date().toISOString(),'''
          if billing_anchor not in s:
              raise SystemExit("billing session update anchor missing")
          s = s.replace(
              billing_anchor,
              '''        status: "contract_accepted",
                  current_step: "billing",
                  contract_summary_id: journey.contract_summary_id,
                  contract_acceptance_id: journey.contract_acceptance_id,
                  post_contract_applied_at: new Date().toISOString(),''',
              1,
          )

          review_anchor = '''      status: "contract_accepted",
                current_step: "review",
                post_contract_applied_at: new Date().toISOString(),'''
          if review_anchor not in s:
              raise SystemExit("review session update anchor missing")
          s = s.replace(
              review_anchor,
              '''      status: "contract_accepted",
                current_step: "review",
                contract_summary_id: journey.contract_summary_id,
                contract_acceptance_id: journey.contract_acceptance_id,
                post_contract_applied_at: new Date().toISOString(),''',
              1,
          )
          p.write_text(s)

          # Deployment workflow.
          p = Path(".github/workflows/deploy-contract-v4-functions.yml")
          s = p.read_text()
          if "supabase/functions/journey2-apply-postcontract/**" not in s:
              a = "      - 'supabase/functions/journey2-prepare-contract/**'\n"
              if a not in s:
                  raise SystemExit("deploy paths anchor missing")
              s = s.replace(a, a + "      - 'supabase/functions/journey2-apply-postcontract/**'\n", 1)
          if "Deploy Journey 2 post-contract handoff" not in s:
              a = '''      - name: Deploy Journey 2 contract preparation
                run: supabase functions deploy journey2-prepare-contract --project-ref "$PROJECT_REF"
          '''
              if a not in s:
                  raise SystemExit("deploy step anchor missing")
              s = s.replace(
                  a,
                  a + '''      - name: Deploy Journey 2 post-contract handoff
                run: supabase functions deploy journey2-apply-postcontract --project-ref "$PROJECT_REF"
          ''',
                  1,
              )
          p.write_text(s)

          # Focused regression tests.
          t = Path("src/lib/legal/__tests__/contract-acceptance-retry.unit.test.ts")
          t.write_text('''import { describe, expect, it } from "vitest";
          import fs from "node:fs";
          import path from "node:path";

          const root = process.cwd();
          const read = (p: string) => fs.readFileSync(path.join(root, p), "utf8");

          describe("contract acceptance retry safety", () => {
            it("checks already-accepted state before OTP replay validation", () => {
              const src = read("supabase/functions/accept-contract-summary/index.ts");
              const idempotency = src.indexOf("Idempotency: already accepted");
              const otpGate = src.indexOf("Independent server-side SMS OTP gate");
              expect(idempotency).toBeGreaterThan(-1);
              expect(otpGate).toBeGreaterThan(-1);
              expect(idempotency).toBeLessThan(otpGate);
            });

            it("recovers UI from a committed acceptance after a lost response", () => {
              const src = read("src/pages/quote/journey/AgreementStep.tsx");
              expect(src).toMatch(/const recovered = await loadDetail\(\)/);
              expect(src).toMatch(/recovered\?\.accepted_at/);
            });

            it("keeps acceptance evidence append-only during post-contract handoff", () => {
              const src = read("supabase/functions/journey2-apply-postcontract/index.ts");
              expect(src).not.toMatch(/from\("contract_acceptances"\)\s*\n\s*\.update/);
              expect(src).toMatch(/contract_acceptance_id: journey\.contract_acceptance_id/);
            });
          });
          ''')
          PY

      - name: Commit hotfix
        shell: bash
        run: |
          git config user.name "occta-hotfix-bot"
          git config user.email "occta-hotfix@users.noreply.github.com"
          git add             supabase/functions/accept-contract-summary/index.ts             supabase/functions/journey2-apply-postcontract/index.ts             src/pages/quote/journey/AgreementStep.tsx             src/lib/legal/__tests__/contract-acceptance-retry.unit.test.ts             .github/workflows/deploy-contract-v4-functions.yml
          git commit -m "Fix contract acceptance retry and session handoff"
          git push origin HEAD:hotfix/contract-acceptance-retry-2026-10-08
