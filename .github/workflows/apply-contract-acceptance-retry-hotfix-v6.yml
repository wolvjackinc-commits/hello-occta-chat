name: Apply Contract Acceptance Retry Hotfix V6

on:
  push:
    branches:
      - hotfix/contract-acceptance-retry-2026-10-08
    paths:
      - .github/workflows/apply-contract-acceptance-retry-hotfix-v6.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: hotfix/contract-acceptance-retry-2026-10-08

      - name: Patch and verify source
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path
          import re

          p = Path("supabase/functions/accept-contract-summary/index.ts")
          s = p.read_text()
          marker = "// Idempotency: already accepted — return existing acceptance + cert ref."
          start = s.index(marker)
          release = s.index("  const releaseBlock = await consumerContractReleaseBlockForDb", start)
          block = s[start:release].rstrip()
          s = s[:start] + s[release:]
          anchor = '  if (!cs) return jsonResponse({ error: "not_found" }, 404);'
          s = s.replace(anchor, anchor + "\n\n  // Retry safety: return existing immutable acceptance before OTP replay checks.\n  " + block, 1)
          old_select = '.select("id, quote_id, contract_summary_id, contract_accepted_at, contract_acceptance_id, status, current_step")'
          new_select = '.select("id, quote_id, contract_summary_id, contract_accepted_at, contract_acceptance_id, status, current_step, journey_version, checkout_session_id")'
          if old_select not in s: raise SystemExit("accept journey select missing")
          s = s.replace(old_select, new_select, 1)
          a = "    contract_information_pack_template_version: currentCip?.template_version ?? null,\n"
          if a not in s: raise SystemExit("accept insert anchor missing")
          s = s.replace(a, a + "    journey_version: journey?.journey_version ?? null,\n    checkout_session_id: journey?.checkout_session_id ?? null,\n", 1)
          p.write_text(s)

          p = Path("src/pages/quote/journey/AgreementStep.tsx")
          s = p.read_text()
          pattern = re.compile(r'(\s*if \(error \|\| \(data as any\)\?\.error\) \{\n)(\s*toast\(\{)')
          match = pattern.search(s)
          if not match: raise SystemExit("AgreementStep error branch missing")
          whitespace = re.match(r'\s*', match.group(2)).group(0)
          recovery = (
            match.group(1)
            + whitespace + "const recovered = await loadDetail();\n"
            + whitespace + "if (recovered?.accepted_at) {\n"
            + whitespace + "  setAcceptedAt(recovered.accepted_at);\n"
            + whitespace + "  setCertificate(recovered.certificate ? { number: recovered.certificate.number, signed_url: recovered.certificate.signed_url } : null);\n"
            + whitespace + '  toast({ title: "Contract accepted", description: "Next, set up your Direct Debit. Nothing is taken today." });\n'
            + whitespace + "  onAccepted();\n"
            + whitespace + "  return;\n"
            + whitespace + "}\n"
            + match.group(2)
          )
          p.write_text(s[:match.start()] + recovery + s[match.end():])

          p = Path("supabase/functions/journey2-apply-postcontract/index.ts")
          s = p.read_text()
          old = '.select("id, quote_id, current_step, status, contract_accepted_at, preferred_start_date, payment_method, billing_anchor_day, earliest_selectable_start_date")'
          new = '.select("id, quote_id, contract_summary_id, contract_acceptance_id, current_step, status, contract_accepted_at, preferred_start_date, payment_method, billing_anchor_day, earliest_selectable_start_date")'
          if old not in s: raise SystemExit("postcontract journey select missing")
          s = s.replace(old, new, 1)
          s, n = re.subn(
            r'\n\s*await supabase\.from\("contract_acceptances"\)\n\s*\.update\(\{ journey_version: "v2", checkout_session_id: session\.checkout_session_id \}\)\n\s*\.eq\("quote_id", journey\.quote_id\)\n\s*\.is\("checkout_session_id", null\);\n',
            "\n", s,
          )
          if n != 2: raise SystemExit(f"acceptance mutation blocks found={n}")
          s = s.replace(
            '        current_step: "billing",\n',
            '        current_step: "billing",\n        contract_summary_id: journey.contract_summary_id,\n        contract_acceptance_id: journey.contract_acceptance_id,\n',
            1,
          )
          s = s.replace(
            '      current_step: "review",\n',
            '      current_step: "review",\n      contract_summary_id: journey.contract_summary_id,\n      contract_acceptance_id: journey.contract_acceptance_id,\n',
            1,
          )
          p.write_text(s)

          t = Path("src/lib/legal/__tests__/contract-acceptance-retry.unit.test.ts")
          t.write_text("""import { describe, expect, it } from "vitest";
          import fs from "node:fs";
          import path from "node:path";
          const read = (p: string) => fs.readFileSync(path.resolve(p), "utf8");
          describe("contract acceptance retry safety", () => {
            it("checks accepted state before OTP replay validation", () => {
              const src = read("supabase/functions/accept-contract-summary/index.ts");
              expect(src.indexOf("Idempotency: already accepted")).toBeGreaterThan(-1);
              expect(src.indexOf("Idempotency: already accepted")).toBeLessThan(src.indexOf("Independent server-side SMS OTP gate"));
            });
            it("recovers UI from committed acceptance after response loss", () => {
              const src = read("src/pages/quote/journey/AgreementStep.tsx");
              expect(src).toContain("const recovered = await loadDetail()");
              expect(src).toContain("recovered?.accepted_at");
            });
            it("does not mutate append-only acceptance evidence in post-contract handoff", () => {
              const src = read("supabase/functions/journey2-apply-postcontract/index.ts");
              expect(src).not.toMatch(/from\\("contract_acceptances"\\)\\s*\\n\\s*\\.update/);
              expect(src).toContain("contract_acceptance_id: journey.contract_acceptance_id");
            });
          });
          """)
          PY
          npm ci --no-audit --no-fund
          npx vitest run src/lib/legal/__tests__/contract-acceptance-retry.unit.test.ts
          npm run typecheck

      - name: Commit source hotfix
        shell: bash
        run: |
          git config user.name "occta-hotfix-bot"
          git config user.email "occta-hotfix@users.noreply.github.com"
          git add             supabase/functions/accept-contract-summary/index.ts             supabase/functions/journey2-apply-postcontract/index.ts             src/pages/quote/journey/AgreementStep.tsx             src/lib/legal/__tests__/contract-acceptance-retry.unit.test.ts
          git commit -m "Fix contract acceptance retry and session handoff"
          git push origin HEAD:hotfix/contract-acceptance-retry-2026-10-08
