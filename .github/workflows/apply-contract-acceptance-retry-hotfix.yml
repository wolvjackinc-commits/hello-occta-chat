name: Apply Contract Acceptance Retry Hotfix

on:
  push:
    branches:
      - hotfix/contract-acceptance-retry-2026-10-08
    paths:
      - .github/workflows/apply-contract-acceptance-retry-hotfix.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: hotfix/contract-acceptance-retry-2026-10-08

      - name: Patch retry-safe acceptance and Journey 2 handoff
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path

          # 1. Acceptance endpoint: retry/idempotency BEFORE OTP replay check,
          # and persist journey traceability on the immutable acceptance row.
          p = Path("supabase/functions/accept-contract-summary/index.ts")
          s = p.read_text()
          marker = "// Idempotency: already accepted — return existing acceptance + cert ref."
          release = "\n\n  const releaseBlock = await consumerContractReleaseBlockForDb"
          start = s.index(marker)
          end = s.index(release, start)
          block = s[start:end]
          s = s[:start] + s[end:]

          anchor = '  if (!cs) return jsonResponse({ error: "not_found" }, 404);\n'
          insert = (
              "\n  // Retry safety: successful acceptance consumes the one-time OTP. "
              "If the browser loses the response and retries, return the already-recorded "
              "immutable acceptance before OTP replay validation.\n  "
              + block
              + "\n"
          )
          s = s.replace(anchor, anchor + insert, 1)

          s = s.replace(
              '.select("id, quote_id, contract_summary_id, contract_accepted_at, contract_acceptance_id, status, current_step")',
              '.select("id, quote_id, contract_summary_id, contract_accepted_at, contract_acceptance_id, status, current_step, journey_version, checkout_session_id")',
              1,
          )

          needle = (
              "    contract_information_pack_template_version: currentCip?.template_version ?? null,\n"
              "    otp_challenge_id: otpChallengeRowId,"
          )
          replacement = (
              "    contract_information_pack_template_version: currentCip?.template_version ?? null,\n"
              "    journey_version: journey?.journey_version ?? null,\n"
              "    checkout_session_id: journey?.checkout_session_id ?? null,\n"
              "    otp_challenge_id: otpChallengeRowId,"
          )
          if needle not in s:
              raise SystemExit("acceptance insert anchor not found")
          s = s.replace(needle, replacement, 1)
          p.write_text(s)

          # 2. Frontend: if the network response is lost after the DB commit,
          # re-read immutable state and continue instead of showing a false failure.
          p = Path("src/pages/quote/journey/AgreementStep.tsx")
          s = p.read_text()
          old = '''      if (error || (data as any)?.error) {
                toast({
                  title: "We couldn't record your acceptance",
                  description: (data as any)?.message || (data as any)?.error || error?.message || "Please try again.",
                  variant: "destructive",
                });
              } else {
          '''
          new = '''      if (error || (data as any)?.error) {
                // The acceptance DB commit is authoritative. A dropped HTTP response
                // must not make a valid signature look like a failure to the customer.
                const recovered = await loadDetail();
                if (recovered?.accepted_at) {
                  setAcceptedAt(recovered.accepted_at);
                  setCertificate(
                    recovered.certificate
                      ? { number: recovered.certificate.number, signed_url: recovered.certificate.signed_url }
                      : null,
                  );
                  toast({ title: "Contract accepted", description: "Next, set up your Direct Debit. Nothing is taken today." });
                  onAccepted();
                  return;
                }
                toast({
                  title: "We couldn't record your acceptance",
                  description: (data as any)?.message || (data as any)?.error || error?.message || "Please try again.",
                  variant: "destructive",
                });
              } else {
          '''
          if old not in s:
              raise SystemExit("AgreementStep error branch anchor not found")
          s = s.replace(old, new, 1)
          p.write_text(s)

          # 3. Post-contract application: keep operational session pointers in sync,
          # never try to mutate append-only legal evidence.
          p = Path("supabase/functions/journey2-apply-postcontract/index.ts")
          s = p.read_text()
          s = s.replace(
              '.select("id, quote_id, current_step, status, contract_accepted_at, preferred_start_date, payment_method, billing_anchor_day, earliest_selectable_start_date")',
              '.select("id, quote_id, contract_summary_id, contract_acceptance_id, current_step, status, contract_accepted_at, preferred_start_date, payment_method, billing_anchor_day, earliest_selectable_start_date")',
              1,
          )

          trace1 = '''    await supabase.from("contract_acceptances")
                .update({ journey_version: "v2", checkout_session_id: session.checkout_session_id })
                .eq("quote_id", journey.quote_id)
                .is("checkout_session_id", null);

          '''
          if trace1 not in s:
              raise SystemExit("first immutable acceptance update block not found")
          s = s.replace(trace1, "", 1)

          trace2 = '''  // Traceability on the acceptance record.
            await supabase.from("contract_acceptances")
              .update({ journey_version: "v2", checkout_session_id: session.checkout_session_id })
              .eq("quote_id", journey.quote_id)
              .is("checkout_session_id", null);

          '''
          if trace2 not in s:
              raise SystemExit("second immutable acceptance update block not found")
          s = s.replace(trace2, "  // Acceptance evidence is append-only. Traceability is written at acceptance time;\n  // operational pointers are kept on the Journey 2 session below.\n\n", 1)

          s = s.replace(
              '''        status: "contract_accepted",
                  current_step: "billing",
                  post_contract_applied_at: new Date().toISOString(),''',
              '''        status: "contract_accepted",
                  current_step: "billing",
                  contract_summary_id: journey.contract_summary_id,
                  contract_acceptance_id: journey.contract_acceptance_id,
                  post_contract_applied_at: new Date().toISOString(),''',
              1,
          )
          s = s.replace(
              '''      status: "contract_accepted",
                current_step: "review",
                post_contract_applied_at: new Date().toISOString(),''',
              '''      status: "contract_accepted",
                current_step: "review",
                contract_summary_id: journey.contract_summary_id,
                contract_acceptance_id: journey.contract_acceptance_id,
                post_contract_applied_at: new Date().toISOString(),''',
              1,
          )
          p.write_text(s)

          # 4. Ensure the post-contract function is deployed with this release.
          p = Path(".github/workflows/deploy-contract-v4-functions.yml")
          s = p.read_text()
          path_anchor = "      - 'supabase/functions/journey2-prepare-contract/**'\n"
          if "supabase/functions/journey2-apply-postcontract/**" not in s:
              s = s.replace(path_anchor, path_anchor + "      - 'supabase/functions/journey2-apply-postcontract/**'\n", 1)
          deploy_anchor = '''      - name: Deploy Journey 2 contract preparation
                run: supabase functions deploy journey2-prepare-contract --project-ref "$PROJECT_REF"
          '''
          deploy_new = deploy_anchor + '''      - name: Deploy Journey 2 post-contract handoff
                run: supabase functions deploy journey2-apply-postcontract --project-ref "$PROJECT_REF"
          '''
          if "Deploy Journey 2 post-contract handoff" not in s:
              if deploy_anchor not in s:
                  raise SystemExit("deploy workflow anchor not found")
              s = s.replace(deploy_anchor, deploy_new, 1)
          p.write_text(s)

          # 5. Regression test: source-order and recovery guarantees.
          t = Path("src/lib/legal/__tests__/contract-acceptance-retry.unit.test.ts")
          t.write_text('''import { describe, expect, it } from "vitest";
          import fs from "node:fs";
          import path from "node:path";

          const root = process.cwd();
          const read = (p: string) => fs.readFileSync(path.join(root, p), "utf8");

          describe("contract acceptance retry safety", () => {
            it("checks already-accepted state before OTP replay validation", () => {
              const src = read("supabase/functions/accept-contract-summary/index.ts");
              const idempotency = src.indexOf("Idempotency: already accepted");
              const otpGate = src.indexOf("Independent server-side SMS OTP gate");
              expect(idempotency).toBeGreaterThan(-1);
              expect(otpGate).toBeGreaterThan(-1);
              expect(idempotency).toBeLessThan(otpGate);
            });

            it("recovers the UI from a committed acceptance after a lost response", () => {
              const src = read("src/pages/quote/journey/AgreementStep.tsx");
              expect(src).toMatch(/const recovered = await loadDetail\(\)/);
              expect(src).toMatch(/if \(recovered\?\.accepted_at\)/);
              expect(src).toMatch(/onAccepted\(\)/);
            });

            it("does not mutate append-only acceptance evidence during post-contract handoff", () => {
              const src = read("supabase/functions/journey2-apply-postcontract/index.ts");
              expect(src).not.toMatch(/from\("contract_acceptances"\)\s*\n\s*\.update/);
              expect(src).toMatch(/contract_acceptance_id: journey\.contract_acceptance_id/);
            });
          });
          ''')
          PY

      - name: Commit hotfix
        shell: bash
        run: |
          git config user.name "occta-hotfix-bot"
          git config user.email "occta-hotfix@users.noreply.github.com"
          git add             supabase/functions/accept-contract-summary/index.ts             supabase/functions/journey2-apply-postcontract/index.ts             src/pages/quote/journey/AgreementStep.tsx             src/lib/legal/__tests__/contract-acceptance-retry.unit.test.ts             .github/workflows/deploy-contract-v4-functions.yml
          git commit -m "Fix contract acceptance retry and session handoff"
          git push origin HEAD:hotfix/contract-acceptance-retry-2026-10-08
