name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: TypeScript typecheck
        run: bunx tsc -p tsconfig.app.json --noEmit
      - name: Lint
        run: bunx eslint .
      - name: Unit tests
        run: bunx vitest run
      - name: Journey 1 regression tests
        run: bunx vitest run src/lib/journey2/__tests__/journey1-regression.test.ts
      - name: Journey 2 integration tests
        run: bunx vitest run src/lib/journey2/__tests__/journey2-integration.test.ts
      - name: Pricing and VAT tests
        run: bunx vitest run src/lib/journey2/__tests__/pricing-vat.test.ts
      - name: Duplicate-submission tests
        run: bunx vitest run src/lib/journey2/__tests__/duplicate-submission.test.ts
      - name: Test-mode isolation tests
        run: bunx vitest run src/lib/journey2/__tests__/test-mode-isolation.test.ts
      - name: Production build
        run: bun run build
