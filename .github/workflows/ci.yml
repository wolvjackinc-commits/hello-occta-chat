name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest

    env:
      # The local Supabase stack: real Postgres with auth/storage/extensions and
      # locally served edge functions. A plain Postgres service is NOT enough,
      # because the Journey 2 migrations depend on Supabase auth and extensions.
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:54322/postgres
      J2_FUNCTIONS_URL: http://127.0.0.1:54321/functions/v1

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Consumer contract release database guard tests
        run: node --test scripts/consumer-contract-release.test.mjs

      - name: Install Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: 2.98.0

      - name: Start the local Supabase stack
        # Historical schedules contain production URLs. Bring up the empty
        # local stack first, then disable cron execution before replaying them.
        run: |
          set -euo pipefail
          mv supabase/migrations /tmp/occta-ci-migrations
          trap 'mkdir -p supabase/migrations; mv /tmp/occta-ci-migrations/*.sql supabase/migrations/; rmdir /tmp/occta-ci-migrations' EXIT
          supabase start
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -c 'CREATE EXTENSION IF NOT EXISTS pg_cron'
          # Only the ephemeral local database container's administrative role
          # can set this server parameter; application roles stay unchanged.
          db_container="$(docker ps --filter publish=54322 --format '{{.ID}}')"
          [[ "$db_container" =~ ^[a-f0-9]{12}$ ]]
          # Historical row triggers also contain production callbacks. Prevent
          # new outbound connections from the test database, retaining replies
          # to incoming test connections. Fail closed if topology changes.
          db_ip="$(docker inspect "$db_container" --format '{{range .NetworkSettings.Networks}}{{.IPAddress}}{{end}}')"
          [[ "$db_ip" =~ ^([0-9]{1,3}\.){3}[0-9]{1,3}$ ]]
          test -z "$(docker inspect "$db_container" --format '{{range .NetworkSettings.Networks}}{{.GlobalIPv6Address}}{{end}}')"
          sudo iptables -I DOCKER-USER -s "$db_ip" -m conntrack --ctstate NEW -j REJECT
          sudo iptables -C DOCKER-USER -s "$db_ip" -m conntrack --ctstate NEW -j REJECT
          docker exec -e PGPASSWORD=postgres "$db_container" psql -U supabase_admin -d postgres -v ON_ERROR_STOP=1 -c "ALTER SYSTEM SET cron.launch_active_jobs = 'off'"
          docker exec -e PGPASSWORD=postgres "$db_container" psql -U supabase_admin -d postgres -v ON_ERROR_STOP=1 -c 'SELECT pg_reload_conf()'
          for i in $(seq 1 10); do
            test "$(psql "$DATABASE_URL" -Atc 'SHOW cron.launch_active_jobs')" = off && break
            sleep 1
          done
          test "$(psql "$DATABASE_URL" -Atc 'SHOW cron.launch_active_jobs')" = off

      - name: Apply every migration through Supabase tooling
        run: |
          supabase migration up --local
          test "$(psql "$DATABASE_URL" -Atc 'SHOW cron.launch_active_jobs')" = off

      - name: Seed dedicated TEST settings and catalogue only
        run: psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f supabase/tests/ci-seed.sql

      - name: Export the local anon key for the engine suite
        run: echo "J2_ANON_KEY=$(supabase status -o env | grep ANON_KEY | cut -d= -f2 | tr -d '\"')" >> "$GITHUB_ENV"

      - name: Serve edge functions locally
        run: |
          # A fresh random test key exercises real encryption without using any
          # production secret. No provider keys or delivery flags are supplied.
          umask 077
          printf 'DD_FIELD_ENC_KEY=%s\n' "$(openssl rand -hex 32)" > /tmp/occta-ci-functions.env
          nohup supabase functions serve --no-verify-jwt --env-file /tmp/occta-ci-functions.env > /tmp/functions.log 2>&1 &
          for i in $(seq 1 60); do
            curl -sf -X OPTIONS -o /dev/null "$J2_FUNCTIONS_URL/journey2-preflight" && break
            sleep 2
          done
          curl -fsS -X OPTIONS -o /dev/null "$J2_FUNCTIONS_URL/journey2-preflight"

      - name: Journey 1 regression tests
        run: npm run test:j1-regression

      - name: Journey 2 database-backed integration tests (real engine)
        run: npm run test:j2-integration

      - name: Pricing and VAT tests
        run: npm run test:pricing-vat

      - name: Duplicate-submission tests
        run: npm run test:duplicate

      - name: Test-mode isolation tests
        run: npm run test:isolation

      - name: Direct Debit manual-provider database tests
        run: npm run test:dd

      - name: TypeScript typecheck
        run: npm run typecheck

      - name: Email contract audit
        run: node scripts/email-contract-audit.mjs

      - name: Lint
        run: npm run lint

      - name: Unit tests (mocked — explicitly unit only)
        run: npm run test:unit

      - name: SWITCH50 PostgreSQL lifecycle tests
        run: npm run test:switch50-db

      - name: Install browser libraries used by the HTML prerender
        run: |
          sudo apt-get update
          sudo apt-get install -y libnss3 libnspr4 libatk1.0-0 libatk-bridge2.0-0 libcups2 libdrm2 libxkbcommon0 libxcomposite1 libxdamage1 libxfixes3 libxrandr2 libgbm1 libpango-1.0-0 libcairo2 libgtk-3-0 libxshmfence1
          sudo apt-get install -y libasound2t64 || sudo apt-get install -y libasound2

      - name: Install Chrome for the HTML prerender
        run: npx puppeteer browsers install chrome

      - name: Production build
        env:
          PRERENDER_REQUIRE_BROWSER: "1"
        run: npm run build

      - name: Edge function logs on failure
        if: failure()
        run: tail -n 200 /tmp/functions.log || true
