name: Customer Companion Check

on:
  pull_request:
    paths:
      - "src/components/chat/OcctaCompanion.tsx"
      - "src/components/chat/OcctaCompanionV3.tsx"
      - "src/components/chat/OcctaCompanionV4.tsx"
      - "src/components/layout/Layout.tsx"
      - "src/components/app/AppLayout.tsx"
      - "src/lib/chat/ollieConversation.ts"
      - "src/lib/chat/ollieIntelligence.ts"
      - "src/lib/chat/ollieBrowserResearch.ts"
      - "src/lib/chat/ollieIntelligence.unit.test.ts"
      - "src/lib/chat/ollieResolution.unit.test.ts"
      - "src/lib/chat/companionCore.unit.test.ts"
      - "supabase/functions/_shared/companionCore.ts"
      - "supabase/functions/_shared/occtaResolution.ts"
      - "supabase/functions/occta-companion/**"
      - "supabase/functions/occta-research/**"
      - "supabase/functions/chat-handoff/**"
      - "supabase/functions/chat-transcript-actions/**"
      - "supabase/functions/chat-attachment-scan/**"
      - ".github/workflows/customer-companion-check.yml"
  push:
    branches:
      - "feature/occta-customer-companion"
      - "fix/ollie-conversation-attachments"
      - "feature/ollie-intelligence-v3"
      - "fix/ollie-production-resolution"
    paths:
      - "src/components/chat/OcctaCompanion.tsx"
      - "src/components/chat/OcctaCompanionV3.tsx"
      - "src/components/chat/OcctaCompanionV4.tsx"
      - "src/components/layout/Layout.tsx"
      - "src/components/app/AppLayout.tsx"
      - "src/lib/chat/ollieConversation.ts"
      - "src/lib/chat/ollieIntelligence.ts"
      - "src/lib/chat/ollieBrowserResearch.ts"
      - "src/lib/chat/ollieIntelligence.unit.test.ts"
      - "src/lib/chat/ollieResolution.unit.test.ts"
      - "src/lib/chat/companionCore.unit.test.ts"
      - "supabase/functions/_shared/companionCore.ts"
      - "supabase/functions/_shared/occtaResolution.ts"
      - "supabase/functions/occta-companion/**"
      - "supabase/functions/occta-research/**"
      - "supabase/functions/chat-handoff/**"
      - "supabase/functions/chat-transcript-actions/**"
      - "supabase/functions/chat-attachment-scan/**"
      - ".github/workflows/customer-companion-check.yml"

permissions:
  contents: read

concurrency:
  group: customer-companion-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: TypeScript typecheck
        run: bun run typecheck

      - name: Lint companion, intelligence and attachment files
        run: >-
          bunx eslint
          src/components/chat/OcctaCompanion.tsx
          src/components/chat/OcctaCompanionV3.tsx
          src/components/chat/OcctaCompanionV4.tsx
          src/components/layout/Layout.tsx
          src/components/app/AppLayout.tsx
          src/lib/chat/ollieConversation.ts
          src/lib/chat/ollieIntelligence.ts
          src/lib/chat/ollieBrowserResearch.ts
          src/lib/chat/ollieIntelligence.unit.test.ts
          src/lib/chat/ollieResolution.unit.test.ts
          src/lib/chat/companionCore.unit.test.ts
          supabase/functions/_shared/companionCore.ts
          supabase/functions/_shared/occtaResolution.ts
          supabase/functions/occta-companion/index.ts
          supabase/functions/occta-research/index.ts
          supabase/functions/chat-handoff/index.ts
          supabase/functions/chat-transcript-actions/index.ts
          supabase/functions/chat-attachment-scan/index.ts

      - name: Companion unit tests
        run: >-
          bunx vitest run
          src/lib/chat/companionCore.unit.test.ts
          src/lib/chat/ollieIntelligence.unit.test.ts
          src/lib/chat/ollieResolution.unit.test.ts

      - name: Production build
        run: bun run build
