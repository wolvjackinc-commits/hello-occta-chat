name: Customer Companion Check

on:
  pull_request:
    paths:
      - "src/components/chat/OcctaCompanion.tsx"
      - "src/components/layout/Layout.tsx"
      - "src/components/app/AppLayout.tsx"
      - "src/lib/chat/companionCore.unit.test.ts"
      - "supabase/functions/_shared/companionCore.ts"
      - "supabase/functions/occta-companion/**"
      - ".github/workflows/customer-companion-check.yml"
  push:
    branches:
      - "feature/occta-customer-companion"
    paths:
      - "src/components/chat/OcctaCompanion.tsx"
      - "src/components/layout/Layout.tsx"
      - "src/components/app/AppLayout.tsx"
      - "src/lib/chat/companionCore.unit.test.ts"
      - "supabase/functions/_shared/companionCore.ts"
      - "supabase/functions/occta-companion/**"
      - ".github/workflows/customer-companion-check.yml"

permissions:
  contents: read

concurrency:
  group: customer-companion-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: TypeScript typecheck
        run: bun run typecheck

      - name: Lint changed companion files
        run: >-
          bunx eslint
          src/components/chat/OcctaCompanion.tsx
          src/components/layout/Layout.tsx
          src/components/app/AppLayout.tsx
          src/lib/chat/companionCore.unit.test.ts
          supabase/functions/_shared/companionCore.ts
          supabase/functions/occta-companion/index.ts

      - name: Companion unit tests
        run: bunx vitest run src/lib/chat/companionCore.unit.test.ts

      - name: Production build
        run: bun run build
