name: Address Lookup Verification and Deploy

on:
  pull_request:
    paths:
      - 'supabase/functions/check-address/**'
      - '.github/workflows/deploy-address-lookup.yml'
  push:
    branches: [main]
    paths:
      - 'supabase/functions/check-address/**'
      - '.github/workflows/deploy-address-lookup.yml'
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Type-check address edge function
        run: deno check supabase/functions/check-address/index.ts

  deploy:
    if: github.event_name != 'pull_request'
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      PROJECT_REF: oexgjmuvgdndizsufipe

    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: 2.98.0

      - name: Confirm deployment credential exists
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "${SUPABASE_ACCESS_TOKEN:-}" ]; then
            echo "SUPABASE_ACCESS_TOKEN is not configured in GitHub Actions. Nothing was deployed."
            exit 1
          fi

      - name: Deploy address lookup
        run: supabase functions deploy check-address --project-ref "$PROJECT_REF"
