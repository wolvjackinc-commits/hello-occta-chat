name: Deploy Billing Functions

on:
  push:
    branches: [main]
    paths:
      - 'supabase/functions/process-first-billing/**'
      - 'supabase/functions/process-recurring-billing/**'
      - 'supabase/functions/_shared/billingHelpers.ts'
      - 'supabase/functions/_shared/billingGate.ts'
      - '.github/workflows/deploy-billing-functions.yml'
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      PROJECT_REF: oexgjmuvgdndizsufipe
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - name: Confirm deployment credential exists
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "${SUPABASE_ACCESS_TOKEN:-}" ]; then
            echo "SUPABASE_ACCESS_TOKEN is not configured in GitHub Actions. Nothing was deployed."
            exit 1
          fi
      - name: Deploy first-billing worker
        run: supabase functions deploy process-first-billing --project-ref "$PROJECT_REF"
      - name: Deploy recurring-billing worker
        run: supabase functions deploy process-recurring-billing --project-ref "$PROJECT_REF"
