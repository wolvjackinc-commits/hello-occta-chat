name: Deploy Billing Functions

on:
  push:
    branches: [main]
    paths:
      - 'supabase/functions/process-first-billing/**'
      - 'supabase/functions/process-recurring-billing/**'
      - 'supabase/functions/process-sim-recurring-billing/**'
      - 'supabase/functions/payment-reminders/**'
      - 'supabase/functions/process-billing-notifications/**'
      - 'supabase/functions/sync-verified-payments/**'
      - 'supabase/functions/get-customer-invoice-pdf/**'
      - 'supabase/functions/admin-payment-recon-import/**'
      - 'supabase/functions/_shared/billingSafety.ts'
      - 'supabase/functions/_shared/billingHelpers.ts'
      - 'supabase/functions/_shared/billingGate.ts'
      - '.github/workflows/deploy-billing-functions.yml'
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      PROJECT_REF: oexgjmuvgdndizsufipe
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - name: Confirm deployment credential exists
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "${SUPABASE_ACCESS_TOKEN:-}" ]; then
            echo "SUPABASE_ACCESS_TOKEN is not configured in GitHub Actions. Nothing was deployed."
            exit 1
          fi
      - name: Deploy first-billing worker
        run: supabase functions deploy process-first-billing --project-ref "$PROJECT_REF"
      - name: Deploy recurring-billing worker
        run: supabase functions deploy process-recurring-billing --project-ref "$PROJECT_REF"
      - name: Deploy SIM recurring-billing worker
        run: supabase functions deploy process-sim-recurring-billing --project-ref "$PROJECT_REF"
      - name: Deploy payment reminders
        run: supabase functions deploy payment-reminders --project-ref "$PROJECT_REF"
      - name: Deploy private invoice access
        run: supabase functions deploy get-customer-invoice-pdf --project-ref "$PROJECT_REF"
      - name: Deploy verified payment processor
        run: supabase functions deploy sync-verified-payments --project-ref "$PROJECT_REF"
      - name: Deploy status notification worker
        run: supabase functions deploy process-billing-notifications --project-ref "$PROJECT_REF"
      - name: Deploy reconciled import endpoint
        run: supabase functions deploy admin-payment-recon-import --project-ref "$PROJECT_REF"
