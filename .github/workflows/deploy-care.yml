name: OCCTA Care verification and deploy

# Type-checks the OCCTA Care edge functions on every change. Lovable deploys
# edge functions when main syncs; the deploy job below is a backup that runs
# only if SUPABASE_ACCESS_TOKEN is configured in GitHub Actions.

on:
  pull_request:
    paths:
      - 'supabase/functions/care-*/**'
      - 'supabase/functions/admin-staff-users/**'
      - 'supabase/functions/_shared/care*.ts'
      - 'supabase/functions/_shared/directDebitGuarantee.ts'
      - 'supabase/migrations/20261102200000_occta_care.sql'
      - 'supabase/migrations/20261103100000_occta_care_hardening.sql'
      - 'supabase/migrations/20261103120000_occta_care_sales_desk.sql'
      - '.github/workflows/deploy-care.yml'
  push:
    branches: [main]
    paths:
      - 'supabase/functions/care-*/**'
      - 'supabase/functions/admin-staff-users/**'
      - 'supabase/functions/_shared/care*.ts'
      - 'supabase/functions/_shared/directDebitGuarantee.ts'
      - '.github/workflows/deploy-care.yml'
  workflow_dispatch:

concurrency:
  group: deploy-care
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Type-check OCCTA Care functions
        run: deno check supabase/functions/care-join/index.ts supabase/functions/care-dispatch/index.ts supabase/functions/care-admin/index.ts supabase/functions/care-sales/index.ts supabase/functions/admin-staff-users/index.ts
      - name: Render every Care letter to PDF
        run: |
          cat > /tmp/render.ts <<'EOF'
          import { buildCareLetter } from "./supabase/functions/_shared/careLetters.ts";
          import { renderCareLetterPdf } from "./supabase/functions/_shared/careLetterPdf.ts";
          import { CARE_LETTER_TYPES } from "./supabase/functions/_shared/careTerms.ts";
          const r = { name: "Test Person", address_line1: "1 Test Road", city: "Huddersfield", postcode: "HD3 3WU", reference: "OCCTA CARE-100001" };
          for (const t of CARE_LETTER_TYPES) {
            const pdf = renderCareLetterPdf(buildCareLetter(t, { price_minor: 499, amount_minor: 499, frequency: "monthly", collection_day: 1, plan_code: "essentials" }, r));
            if (pdf.byteLength < 2000) throw new Error(`${t} produced an empty PDF`);
            console.log(t, pdf.byteLength);
          }
          EOF
          cp /tmp/render.ts ./care-render-check.ts && deno run --allow-read ./care-render-check.ts && rm ./care-render-check.ts

  deploy:
    if: github.event_name != 'pull_request'
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      PROJECT_REF: oexgjmuvgdndizsufipe
    steps:
      - name: Check deployment credential
        id: cred
        shell: bash
        run: |
          if [ -z "${SUPABASE_ACCESS_TOKEN:-}" ]; then
            echo "SUPABASE_ACCESS_TOKEN not configured: Lovable deploys these functions when main syncs."
            echo "present=false" >> "$GITHUB_OUTPUT"
          else
            echo "present=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@v4
        if: steps.cred.outputs.present == 'true'
      - uses: supabase/setup-cli@v1
        if: steps.cred.outputs.present == 'true'
        with:
          version: 2.98.0
      - name: Deploy Care functions
        if: steps.cred.outputs.present == 'true'
        run: |
          supabase functions deploy care-join --project-ref "$PROJECT_REF"
          supabase functions deploy care-admin --project-ref "$PROJECT_REF"
          supabase functions deploy care-dispatch --project-ref "$PROJECT_REF" --no-verify-jwt
      - name: Verify unauthenticated calls are refused
        if: steps.cred.outputs.present == 'true'
        shell: bash
        run: |
          set -euo pipefail
          for f in care-join care-admin care-dispatch; do
            code=$(curl -s -o /dev/null -w '%{http_code}' -X POST "https://${PROJECT_REF}.supabase.co/functions/v1/$f" -H 'Content-Type: application/json' -d '{}')
            echo "$f unauthenticated: $code"
            [ "$code" = "401" ] || { echo "expected 401"; exit 1; }
          done
