name: Chat Functions Verification and Deploy

# Type-checks Ollie (occta-companion), the live chat handoff and the admin AI
# assistant. Lovable "Publish" ships the website only; the deploy job runs only
# if a SUPABASE_ACCESS_TOKEN secret exists, otherwise Lovable deploys them.
on:
  pull_request:
    paths:
      - 'supabase/functions/occta-companion/**'
      - 'supabase/functions/chat-handoff/**'
      - 'supabase/functions/ai-chat/**'
      - 'supabase/functions/_shared/companionCore.ts'
      - 'supabase/functions/_shared/aiSafety.ts'
      - 'supabase/functions/_shared/supportTickets.ts'
      - 'supabase/functions/_shared/quoteHelpers.ts'
      - 'supabase/functions/submit-support-ticket/**'
      - '.github/workflows/deploy-chat-functions.yml'
  push:
    branches: [main]
    paths:
      - 'supabase/functions/occta-companion/**'
      - 'supabase/functions/chat-handoff/**'
      - 'supabase/functions/ai-chat/**'
      - 'supabase/functions/_shared/companionCore.ts'
      - 'supabase/functions/_shared/aiSafety.ts'
      - 'supabase/functions/_shared/supportTickets.ts'
      - 'supabase/functions/_shared/quoteHelpers.ts'
      - 'supabase/functions/submit-support-ticket/**'
      - '.github/workflows/deploy-chat-functions.yml'
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Type-check chat edge functions
        run: |
          deno check --no-lock supabase/functions/occta-companion/index.ts
          deno check --no-lock supabase/functions/chat-handoff/index.ts
          deno check --no-lock supabase/functions/ai-chat/index.ts
          deno check --no-lock supabase/functions/submit-support-ticket/index.ts

  deploy:
    if: github.event_name != 'pull_request'
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      PROJECT_REF: oexgjmuvgdndizsufipe

    steps:
      # Supabase is managed by Lovable Cloud, so there is normally no token here
      # and Lovable deploys the functions. Skip quietly rather than fail the run.
      - name: Check deployment credential
        id: credential
        shell: bash
        run: |
          if [ -z "${SUPABASE_ACCESS_TOKEN:-}" ]; then
            echo "::notice title=Deploy skipped::SUPABASE_ACCESS_TOKEN is not configured. Nothing was deployed; ask Lovable to deploy occta-companion, chat-handoff, ai-chat and submit-support-ticket."
            echo "available=false" >> "$GITHUB_OUTPUT"
          else
            echo "available=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v4
        if: steps.credential.outputs.available == 'true'
      - uses: supabase/setup-cli@v1
        if: steps.credential.outputs.available == 'true'
        with:
          version: 2.98.0

      - name: Deploy Ollie customer companion
        if: steps.credential.outputs.available == 'true'
        run: supabase functions deploy occta-companion --project-ref "$PROJECT_REF"

      - name: Deploy live chat handoff
        if: steps.credential.outputs.available == 'true'
        run: supabase functions deploy chat-handoff --project-ref "$PROJECT_REF"

      - name: Deploy admin AI assistant
        if: steps.credential.outputs.available == 'true'
        run: supabase functions deploy ai-chat --project-ref "$PROJECT_REF"

      - name: Deploy support ticket intake
        if: steps.credential.outputs.available == 'true'
        run: supabase functions deploy submit-support-ticket --project-ref "$PROJECT_REF"
