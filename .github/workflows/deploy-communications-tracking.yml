name: Deploy Communications Tracking

on:
  push:
    branches: [main]
    paths:
      - 'supabase/functions/_shared/quoteHelpers.ts'
      - 'supabase/functions/email-open-track/**'
      - 'supabase/functions/journey2-resume-email/**'
      - 'supabase/functions/submit-quote-request/**'
      - 'supabase/functions/submit-build-plan/**'
      - '.github/workflows/deploy-communications-tracking.yml'
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      PROJECT_REF: oexgjmuvgdndizsufipe
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - name: Confirm deployment credential exists
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "${SUPABASE_ACCESS_TOKEN:-}" ]; then
            echo "SUPABASE_ACCESS_TOKEN is not configured in GitHub Actions. Nothing was deployed."
            exit 1
          fi
      - name: Deploy email open tracker
        run: supabase functions deploy email-open-track --project-ref "$PROJECT_REF"
      - name: Deploy Journey 2 reminder sender
        run: supabase functions deploy journey2-resume-email --project-ref "$PROJECT_REF"
      - name: Deploy quote request sender
        run: supabase functions deploy submit-quote-request --project-ref "$PROJECT_REF"
      - name: Deploy Build Plan sender
        run: supabase functions deploy submit-build-plan --project-ref "$PROJECT_REF"
