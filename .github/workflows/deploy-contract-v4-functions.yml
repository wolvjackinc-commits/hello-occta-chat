name: Deploy OCCTA Production Contract Functions

on:
  push:
    branches: [main]
    paths:
      - 'supabase/functions/_shared/buildPlanResolver.ts'
      - 'supabase/functions/_shared/legalText.ts'
      - 'supabase/functions/_shared/twoDocLegalText.ts'
      - 'supabase/functions/_shared/productionConsumerContract.ts'
      - 'supabase/functions/_shared/consumerContractRelease.ts'
      - 'supabase/functions/generate-service-aware-cs/**'
      - 'supabase/functions/accept-contract-summary-authed/**'
      - 'supabase/functions/admin-issue-revised-cs/**'
      - 'supabase/functions/_shared/journey2Snapshot.ts'
      - 'supabase/functions/_shared/networkAvailability.ts'
      - 'supabase/functions/journey2-session/**'
      - 'supabase/functions/journey-cs-detail/**'
      - 'supabase/functions/admin-record-network-validation/**'
      - 'supabase/functions/resolve-build-plan-price/**'
      - 'supabase/functions/create-quote/**'
      - 'supabase/functions/submit-build-plan/**'
      - 'supabase/functions/generate-contract-summary/**'
      - 'supabase/functions/generate-contract-summary-pdf/**'
      - 'supabase/functions/generate-contract-information-pack/**'
      - 'supabase/functions/journey-generate-cs/**'
      - 'supabase/functions/journey2-prepare-contract/**'
      - 'supabase/functions/accept-contract-summary/**'
      - 'supabase/functions/accept-service-aware-cs/**'
      - 'supabase/functions/generate-acceptance-certificate/**'
      - 'supabase/functions/journey-submit-order/**'
      - 'supabase/functions/_shared/brandedEmailShell.ts'
      - 'supabase/functions/process-activation-outbox/**'
      - 'supabase/functions/dd-outbox-worker/**'
      - 'supabase/functions/dd-status-notify/**'
      - 'supabase/functions/switch50-message-worker/**'
      - '.github/workflows/deploy-contract-v4-functions.yml'
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      PROJECT_REF: oexgjmuvgdndizsufipe
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - name: Confirm deployment credential exists
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "${SUPABASE_ACCESS_TOKEN:-}" ]; then
            echo "SUPABASE_ACCESS_TOKEN is not configured in GitHub Actions. Nothing was deployed."
            exit 1
          fi
      - name: Deploy pricing resolver
        run: supabase functions deploy resolve-build-plan-price --project-ref "$PROJECT_REF"
      - name: Deploy public Build Plan submitter
        run: supabase functions deploy submit-build-plan --project-ref "$PROJECT_REF"
      - name: Deploy admin quote creator
        run: supabase functions deploy create-quote --project-ref "$PROJECT_REF"
      - name: Deploy Contract Summary generator
        run: supabase functions deploy generate-contract-summary --project-ref "$PROJECT_REF"
      - name: Deploy Contract Summary PDF renderer
        run: supabase functions deploy generate-contract-summary-pdf --project-ref "$PROJECT_REF"
      - name: Deploy Contract Information Pack generator
        run: supabase functions deploy generate-contract-information-pack --project-ref "$PROJECT_REF"
      - name: Deploy journey contract wrapper
        run: supabase functions deploy journey-generate-cs --project-ref "$PROJECT_REF"
      - name: Deploy Journey 2 session
        run: supabase functions deploy journey2-session --project-ref "$PROJECT_REF"
      - name: Deploy Journey 2 contract preparation
        run: supabase functions deploy journey2-prepare-contract --project-ref "$PROJECT_REF"
      - name: Deploy Journey contract detail
        run: supabase functions deploy journey-cs-detail --project-ref "$PROJECT_REF"
      - name: Deploy admin network validation
        run: supabase functions deploy admin-record-network-validation --project-ref "$PROJECT_REF"
      - name: Deploy primary contract acceptance
        run: supabase functions deploy accept-contract-summary --project-ref "$PROJECT_REF"
      - name: Deploy authenticated contract acceptance
        run: supabase functions deploy accept-contract-summary-authed --project-ref "$PROJECT_REF"
      - name: Deploy service-aware issuance
        run: supabase functions deploy generate-service-aware-cs --project-ref "$PROJECT_REF"
      - name: Deploy revised contract issuance
        run: supabase functions deploy admin-issue-revised-cs --project-ref "$PROJECT_REF"
      - name: Deploy service-aware acceptance
        run: supabase functions deploy accept-service-aware-cs --project-ref "$PROJECT_REF"
      - name: Deploy acceptance certificate generator
        run: supabase functions deploy generate-acceptance-certificate --project-ref "$PROJECT_REF"
      - name: Deploy order submission/customer confirmation
        run: supabase functions deploy journey-submit-order --project-ref "$PROJECT_REF"
      - name: Deploy activation outbox consumer
        run: supabase functions deploy process-activation-outbox --project-ref "$PROJECT_REF"
      - name: Deploy Direct Debit outbox worker
        run: supabase functions deploy dd-outbox-worker --project-ref "$PROJECT_REF"
      - name: Deploy Direct Debit status notifier
        run: supabase functions deploy dd-status-notify --project-ref "$PROJECT_REF"
      - name: Deploy SWITCH50 message worker
        run: supabase functions deploy switch50-message-worker --project-ref "$PROJECT_REF"
