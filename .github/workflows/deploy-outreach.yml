name: Deploy outreach campaign manager

on:
  push:
    branches: [main]
    paths:
      - 'supabase/migrations/20261012140000_outreach_campaign_manager.sql'
      - 'supabase/functions/outreach-*/**'
      - 'supabase/functions/_shared/outreach.ts'
      - 'supabase/functions/_shared/outreachSender.ts'
      - 'supabase/functions/_shared/svix.ts'
      - '.github/workflows/deploy-outreach.yml'
  workflow_dispatch:

concurrency:
  group: deploy-outreach
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      PROJECT_REF: oexgjmuvgdndizsufipe
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Confirm deployment credential exists
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "${SUPABASE_ACCESS_TOKEN:-}" ]; then
            echo "SUPABASE_ACCESS_TOKEN is not configured in GitHub Actions. Nothing was deployed."
            exit 1
          fi

      - name: Apply the outreach migration (idempotent)
        shell: bash
        run: |
          set -euo pipefail
          python3 << 'PY'
          import json, os, urllib.error, urllib.request

          ref = os.environ["PROJECT_REF"]
          token = os.environ["SUPABASE_ACCESS_TOKEN"]
          url = f"https://api.supabase.com/v1/projects/{ref}/database/query"
          migration = "supabase/migrations/20261012140000_outreach_campaign_manager.sql"

          def query(sql: str):
              req = urllib.request.Request(
                  url,
                  data=json.dumps({"query": sql}).encode(),
                  headers={
                      "Authorization": f"Bearer {token}",
                      "Content-Type": "application/json",
                      "User-Agent": "occta-outreach-deploy",
                  },
                  method="POST",
              )
              try:
                  with urllib.request.urlopen(req, timeout=120) as resp:
                      return json.loads(resp.read().decode() or "[]")
              except urllib.error.HTTPError as err:
                  raise SystemExit(f"database query failed: HTTP {err.code} {err.read().decode(errors='replace')[:600]}")

          # The file is written to be re-runnable and is applied as one script
          # so it succeeds or fails as a unit.
          sql_text = open(migration, encoding="utf-8").read()
          query(sql_text)
          print("migration applied")

          names = sorted(r["table_name"] for r in query(
              "select table_name from information_schema.tables "
              "where table_schema = 'public' and table_name like 'outreach_%' order by table_name"))
          print("outreach_tables", ",".join(names))
          expected = {"outreach_settings", "outreach_contacts", "outreach_suppressions", "outreach_templates",
                      "outreach_campaigns", "outreach_messages", "outreach_events", "outreach_campaign_stats"}
          missing = expected - set(names)
          if missing:
              raise SystemExit(f"missing: {', '.join(sorted(missing))}")

          rls = query("select relname, relrowsecurity from pg_class where relname like 'outreach_%' and relkind = 'r'")
          off = [r["relname"] for r in rls if not r["relrowsecurity"]]
          if off:
              raise SystemExit(f"row level security is off for: {', '.join(off)}")
          print("row_level_security on for", len(rls), "tables")

          triggers = query("select tgname from pg_trigger where tgname in ('trg_outreach_conversion_business_leads','trg_outreach_conversion_business_quotes')")
          print("conversion_triggers", len(triggers))
          if len(triggers) != 2:
              raise SystemExit("conversion triggers missing")

          # Report whether the scheduled sender exists and carries the cron secret
          # header, without printing the command (it contains the secret).
          jobs = query("select jobname, schedule, position('x-cron-secret' in command) > 0 as has_secret_header "
                       "from cron.job where jobname = 'outreach-worker'")
          print("outreach_worker_schedule", json.dumps(jobs))
          if not jobs:
              print("::warning::outreach-worker was not scheduled (no cron template found). Use 'Send next batch now' or schedule it manually.")
          elif not jobs[0]["has_secret_header"]:
              print("::warning::outreach-worker cron command has no x-cron-secret header; the worker will reject it.")

          cols = {r["column_name"] for r in query(
              "select column_name from information_schema.columns "
              "where table_schema = 'supabase_migrations' and table_name = 'schema_migrations'")}
          if {"version", "name"}.issubset(cols):
              query("insert into supabase_migrations.schema_migrations (version, name) "
                    "select '20261012140000', 'outreach_campaign_manager' "
                    "where not exists (select 1 from supabase_migrations.schema_migrations where version = '20261012140000')")
              print("schema_migrations_recorded 20261012140000")
          PY

      # Staff-only: gateway JWT verification stays on, and the function checks roles.
      - name: Deploy outreach-admin
        run: supabase functions deploy outreach-admin --project-ref "$PROJECT_REF"

      # Called by email clients, Resend and pg_cron, none of which carry a user JWT.
      # Each function authenticates its own callers (token, Svix signature, cron secret).
      - name: Deploy public outreach endpoints
        run: |
          supabase functions deploy outreach-track --project-ref "$PROJECT_REF" --no-verify-jwt
          supabase functions deploy outreach-unsubscribe --project-ref "$PROJECT_REF" --no-verify-jwt
          supabase functions deploy outreach-resend-webhook --project-ref "$PROJECT_REF" --no-verify-jwt
          supabase functions deploy outreach-worker --project-ref "$PROJECT_REF" --no-verify-jwt

      - name: Live security and behaviour checks
        shell: bash
        run: |
          set -euo pipefail
          base="https://${PROJECT_REF}.supabase.co/functions/v1"
          expect() {
            local name="$1" want="$2" got="$3"
            echo "${name}: HTTP ${got} (expected ${want})"
            [[ "$want" == *"$got"* ]] || { echo "::error::${name} returned ${got}"; exit 1; }
          }
          sleep 10
          expect "admin without login" "401" "$(curl -s -o /dev/null -w '%{http_code}' -X POST "$base/outreach-admin" -H 'Content-Type: application/json' -d '{"action":"run_worker"}')"
          expect "worker without cron secret" "401" "$(curl -s -o /dev/null -w '%{http_code}' -X POST "$base/outreach-worker")"
          expect "worker with wrong secret" "401" "$(curl -s -o /dev/null -w '%{http_code}' -X POST "$base/outreach-worker" -H 'x-cron-secret: wrong')"
          expect "webhook without signature" "401 503" "$(curl -s -o /dev/null -w '%{http_code}' -X POST "$base/outreach-resend-webhook" -d '{}')"
          expect "unsubscribe with bad token" "400" "$(curl -s -o /dev/null -w '%{http_code}' -X POST "$base/outreach-unsubscribe?t=bad")"
          ctype="$(curl -s -o /dev/null -w '%{content_type}' "$base/outreach-track?t=unknowntoken000000&o=1")"
          echo "tracking pixel content-type: ${ctype}"
          [[ "$ctype" == image/gif* ]] || { echo "::error::tracking pixel did not return a GIF"; exit 1; }
          loc="$(curl -s -o /dev/null -w '%{redirect_url}' "$base/outreach-track?t=unknowntoken000000&l=0")"
          echo "unknown click redirects to: ${loc}"
          [[ "$loc" == https://www.occta.co.uk* ]] || { echo "::error::click tracker redirected somewhere unexpected"; exit 1; }
          webhook_state="$(curl -s -o /dev/null -w '%{http_code}' -X POST "$base/outreach-resend-webhook" -d '{}')"
          if [ "$webhook_state" = "503" ]; then
            echo "::notice::RESEND_WEBHOOK_SECRET is not set yet, so deliveries, bounces and complaints are not recorded until it is."
          fi
