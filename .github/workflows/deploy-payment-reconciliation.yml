name: Deploy payment reconciliation

on:
  push:
    branches: [main]
    paths:
      - 'supabase/migrations/20261008201000_payment_reconciliation.sql'
      - 'supabase/functions/admin-payment-recon-import/**'
      - 'supabase/functions/_shared/paymentReconEngine.ts'
      - '.github/workflows/deploy-payment-reconciliation.yml'
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      PROJECT_REF: oexgjmuvgdndizsufipe
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Confirm deployment credential exists
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "${SUPABASE_ACCESS_TOKEN:-}" ]; then
            echo "SUPABASE_ACCESS_TOKEN is not configured in GitHub Actions. Nothing was deployed."
            exit 1
          fi
          test ! -e supabase/seeds/payment_reconciliation_demo.sql || echo "Demo seed is present in the repo and is not applied by this workflow."

      - name: Apply only the payment reconciliation migration
        shell: bash
        run: |
          set -euo pipefail
          python3 << 'PY'
          import json, os, urllib.error, urllib.request

          ref = os.environ["PROJECT_REF"]
          token = os.environ["SUPABASE_ACCESS_TOKEN"]
          url = f"https://api.supabase.com/v1/projects/{ref}/database/query"
          migration = "supabase/migrations/20261008201000_payment_reconciliation.sql"

          def split_sql(sql: str) -> list[str]:
              parts: list[str] = []
              buf: list[str] = []
              i = 0
              dollar = None
              in_single = False
              while i < len(sql):
                  if dollar:
                      if sql.startswith(dollar, i):
                          buf.append(dollar)
                          i += len(dollar)
                          dollar = None
                          continue
                      buf.append(sql[i])
                      i += 1
                      continue
                  if in_single:
                      buf.append(sql[i])
                      if sql[i] == "'":
                          if i + 1 < len(sql) and sql[i + 1] == "'":
                              buf.append("'")
                              i += 2
                              continue
                          in_single = False
                      i += 1
                      continue
                  if sql[i] == "'":
                      in_single = True
                      buf.append(sql[i])
                      i += 1
                      continue
                  if sql[i] == "$":
                      j = i + 1
                      while j < len(sql) and (sql[j].isalnum() or sql[j] == "_"):
                          j += 1
                      if j < len(sql) and sql[j] == "$":
                          dollar = sql[i:j + 1]
                          buf.append(dollar)
                          i = j + 1
                          continue
                  if sql[i] == ";":
                      stmt = "".join(buf).strip()
                      if stmt:
                          parts.append(stmt)
                      buf = []
                      i += 1
                      continue
                  buf.append(sql[i])
                  i += 1
              tail = "".join(buf).strip()
              if tail:
                  parts.append(tail)
              return parts

          def query(sql: str):
              req = urllib.request.Request(
                  url,
                  data=json.dumps({"query": sql}).encode(),
                  headers={
                      "Authorization": f"Bearer {token}",
                      "Content-Type": "application/json",
                      "User-Agent": "occta-payment-recon-deploy",
                  },
                  method="POST",
              )
              try:
                  with urllib.request.urlopen(req, timeout=120) as resp:
                      raw = resp.read().decode()
                      return resp.status, raw
              except urllib.error.HTTPError as err:
                  raw = err.read().decode(errors="replace")
                  raise SystemExit(f"database query failed: HTTP {err.code} {raw[:600]}")

          sql_text = open(migration, encoding="utf-8").read()
          if "payment_reconciliation_demo" in sql_text or "insert into public.payment_recon_" in sql_text.lower():
              raise SystemExit("Refusing to apply a file that inserts reconciliation rows.")
          statements = [s for s in split_sql(sql_text) if not s.lstrip().startswith("--")]
          # Keep leading comments that belong to a real statement; drop comment-only chunks.
          statements = [s for s in statements if any(line.strip() and not line.strip().startswith("--") for line in s.splitlines())]
          print(f"applying {len(statements)} statements from {migration}")
          for index, statement in enumerate(statements, start=1):
              status, _body = query(statement)
              print(f"statement {index} http {status}")

          status, body = query(
              "select table_name from information_schema.tables "
              "where table_schema = 'public' and table_name like 'payment_recon_%' "
              "order by table_name"
          )
          rows = json.loads(body)
          names = sorted(row.get("table_name") for row in rows)
          print("payment_recon_tables", ",".join(names))
          expected = {
              "payment_recon_accounts",
              "payment_recon_audit",
              "payment_recon_bank_lines",
              "payment_recon_imports",
              "payment_recon_mandates",
              "payment_recon_payments",
              "payment_recon_payouts",
              "payment_recon_timeline",
          }
          missing = expected - set(names)
          if missing:
              raise SystemExit(f"missing tables: {', '.join(sorted(missing))}")

          # Record the version when the history table has the expected columns.
          # A mismatch is reported and does not roll back the tables.
          try:
              _status, cols_body = query(
                  "select column_name from information_schema.columns "
                  "where table_schema = 'supabase_migrations' and table_name = 'schema_migrations'"
              )
              cols = {row.get("column_name") for row in json.loads(cols_body)}
              if {"version", "name"}.issubset(cols):
                  query(
                      "insert into supabase_migrations.schema_migrations (version, name) "
                      "select '20261008201000', 'payment_reconciliation' "
                      "where not exists (select 1 from supabase_migrations.schema_migrations "
                      "where version = '20261008201000')"
                  )
                  print("schema_migrations_recorded 20261008201000")
              else:
                  print("schema_migrations_columns", ",".join(sorted(c for c in cols if c)))
          except SystemExit as err:
              print("schema_migrations_record_skipped", str(err)[:400])
          PY

      - name: Deploy admin-payment-recon-import only
        run: supabase functions deploy admin-payment-recon-import --project-ref "$PROJECT_REF"

      - name: Confirm unauthenticated calls are rejected
        shell: bash
        run: |
          set -euo pipefail
          code="$(curl -sS -o /tmp/payment-recon-fn.json -w "%{http_code}" -X POST \
            "https://${PROJECT_REF}.supabase.co/functions/v1/admin-payment-recon-import" \
            -H "Content-Type: application/json" \
            -d '{}')"
          echo "function_http_status=${code}"
          python3 - << 'PY'
          import pathlib
          text = pathlib.Path("/tmp/payment-recon-fn.json").read_text(errors="replace")[:300]
          print("function_body", text.replace("\n", " "))
          PY
          case "$code" in
            401|403) echo "Unauthenticated call rejected." ;;
            *) echo "Expected 401 or 403 from the admin-only function."; exit 1 ;;
          esac
