name: Deploy phone orders

on:
  pull_request:
    paths:
      - 'supabase/functions/admin-create-phone-quote-request/**'
      - '.github/workflows/deploy-phone-orders.yml'
  push:
    branches: [main]
    paths:
      - 'supabase/functions/admin-create-phone-quote-request/**'
      - '.github/workflows/deploy-phone-orders.yml'
  workflow_dispatch:

concurrency:
  group: deploy-phone-orders
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Type-check phone order function
        run: deno check supabase/functions/admin-create-phone-quote-request/index.ts

  deploy:
    if: github.event_name != 'pull_request'
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      PROJECT_REF: oexgjmuvgdndizsufipe
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: 2.98.0
      - name: Confirm deployment credential exists
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "${SUPABASE_ACCESS_TOKEN:-}" ]; then
            echo "SUPABASE_ACCESS_TOKEN is not configured in GitHub Actions. Nothing was deployed."
            exit 1
          fi
      - name: Deploy phone order function
        run: supabase functions deploy admin-create-phone-quote-request --project-ref "$PROJECT_REF"
      - name: Verify it rejects unauthenticated calls
        shell: bash
        run: |
          set -euo pipefail
          code=$(curl -s -o /dev/null -w '%{http_code}' -X POST \
            "https://${PROJECT_REF}.supabase.co/functions/v1/admin-create-phone-quote-request" \
            -H 'Content-Type: application/json' -d '{}')
          echo "unauthenticated status: $code"
          [ "$code" = "401" ] || { echo "expected 401"; exit 1; }
