name: Deploy phone orders

on:
  pull_request:
    paths:
      - 'supabase/functions/admin-create-phone-quote-request/**'
      - '.github/workflows/deploy-phone-orders.yml'
  push:
    branches: [main]
    paths:
      - 'supabase/functions/admin-create-phone-quote-request/**'
      - '.github/workflows/deploy-phone-orders.yml'
  workflow_dispatch:

concurrency:
  group: deploy-phone-orders
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Type-check phone order function
        run: deno check supabase/functions/admin-create-phone-quote-request/index.ts

  deploy:
    if: github.event_name != 'pull_request'
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      PROJECT_REF: oexgjmuvgdndizsufipe
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: 2.98.0
      # The backend is Lovable Cloud, which deploys edge functions itself when
      # it syncs main. A CLI deploy only runs if a token is ever configured.
      - name: Deploy phone order function (only if a CLI token exists)
        if: env.SUPABASE_ACCESS_TOKEN != ''
        run: supabase functions deploy admin-create-phone-quote-request --project-ref "$PROJECT_REF"
      - name: Verify the live function exists and rejects unauthenticated calls
        shell: bash
        run: |
          set -euo pipefail
          url="https://${PROJECT_REF}.supabase.co/functions/v1/admin-create-phone-quote-request"
          for i in $(seq 1 20); do
            code=$(curl -s -o /dev/null -w '%{http_code}' -X POST "$url" -H 'Content-Type: application/json' -d '{}' || true)
            echo "attempt $i: HTTP $code"
            [ "$code" = "401" ] && { echo "live and locked to staff"; exit 0; }
            sleep 30
          done
          echo "function is not live (expected 401 from an unauthenticated call)"
          exit 1
