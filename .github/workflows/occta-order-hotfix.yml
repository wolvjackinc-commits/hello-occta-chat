name: OCCTA Order Journey Production Hotfix

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/occta-order-hotfix.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: occta-order-hotfix-production
  cancel-in-progress: false

jobs:
  hotfix:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      PROJECT_REF: oexgjmuvgdndizsufipe
    steps:
      - name: Checkout production main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Patch order journey desktop layout
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          p = Path('src/pages/order/OrderJourney.tsx')
          s = p.read_text()
          replacements = {
              'className="container mx-auto px-4 py-10 max-w-5xl"': 'className="mx-auto w-full max-w-[1600px] px-4 py-8 sm:px-6 lg:px-8 lg:py-10"',
              'className="grid gap-6 lg:grid-cols-[1fr_320px] items-start"': 'className="grid items-start gap-6 xl:grid-cols-[minmax(0,1fr)_360px] xl:gap-8"',
          }
          for old, new in replacements.items():
              count = s.count(old)
              if count == 0 and new in s:
                  continue
              if count != 1:
                  raise SystemExit(f'Expected exactly one layout target for {old!r}, found {count}')
              s = s.replace(old, new, 1)
          p.write_text(s)
          PY
          git diff --check
          git diff -- src/pages/order/OrderJourney.tsx

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Production build
        run: npm run build

      - name: Commit production UI hotfix
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- src/pages/order/OrderJourney.tsx; then
            echo 'Order layout already contains the production hotfix.'
            exit 0
          fi
          git config user.name 'OCCTA Production Hotfix'
          git config user.email 'actions@users.noreply.github.com'
          git add src/pages/order/OrderJourney.tsx
          git commit -m 'fix(order): use production-width checkout layout'
          git pull --rebase origin main
          git push origin HEAD:main

      - name: Set up Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Confirm Supabase deployment credential
        shell: bash
        run: |
          set -euo pipefail
          test -n "${SUPABASE_ACCESS_TOKEN:-}" || { echo 'SUPABASE_ACCESS_TOKEN is missing'; exit 1; }

      - name: Redeploy Journey 2 catalogue and session
        shell: bash
        run: |
          set -euo pipefail
          supabase functions deploy journey2-catalogue --project-ref "$PROJECT_REF"
          supabase functions deploy journey2-session --project-ref "$PROJECT_REF"

      - name: Verify all public OCCTA broadband bands are live
        shell: bash
        run: |
          set -euo pipefail
          endpoint="https://${PROJECT_REF}.supabase.co/functions/v1/journey2-catalogue"
          ok=0
          for attempt in 1 2 3 4 5; do
            body="$(curl -fsS -X POST "$endpoint" -H 'content-type: application/json' --data '{"customer_type":"residential"}' || true)"
            echo "$body" | jq -e '.ok == true' >/dev/null 2>&1 || { sleep 4; continue; }
            buckets="$(echo "$body" | jq -r '.catalogue.plans[].speed_bucket' | sort -u | tr '\n' ' ')"
            echo "Live public broadband buckets: $buckets"
            if echo "$body" | jq -e '[.catalogue.plans[].speed_bucket] as $b | (["essential","superfast","ultrafast"] | all(. as $x | $b | index($x)))' >/dev/null; then
              ok=1
              break
            fi
            sleep 4
          done
          test "$ok" -eq 1 || { echo 'Production catalogue is still missing one or more public OCCTA broadband bands.'; exit 1; }
