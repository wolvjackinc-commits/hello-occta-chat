name: OCCTA Signing UX Production Hotfix

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/occta-signing-ux-hotfix.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: occta-signing-ux-production
  cancel-in-progress: false

jobs:
  hotfix:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout production main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Simplify agreement confirmations and widen order layouts
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          p = Path('src/pages/quote/journey/AgreementStep.tsx')
          s = p.read_text()

          start = s.index('const CHECKBOXES = [')
          end_marker = 'type CbKey = typeof CHECKBOXES[number]["key"];'
          end = s.index(end_marker, start) + len(end_marker)
          s = s[:start] + '''const REVIEW_CONFIRMATION =
            "I confirm that I have received and reviewed my Contract Summary and Contract Information, that my personal details and service address are correct, and that I understand the monthly and one-off charges, contract term, cancellation rights and payment arrangements.";
          const CONSENT_CONFIRMATION =
            "I agree to enter into this agreement with OCCTA LIMITED on the terms shown in my Contract Summary and Contract Information.";''' + s[end:]

          s = s.replace(
            '  const [addressConfirmed, setAddressConfirmed] = useState(false);\n  const [checks, setChecks] = useState<Record<CbKey, boolean>>({ received_read: false, details_correct: false, understand_charges: false, consent: false });',
            '  const [reviewConfirmed, setReviewConfirmed] = useState(false);\n  const [consentConfirmed, setConsentConfirmed] = useState(false);',
            1,
          )
          s = s.replace(
            '  const allChecksTicked = CHECKBOXES.every((c) => checks[c.key]);',
            '  const allChecksTicked = reviewConfirmed && consentConfirmed;',
            1,
          )
          s = s.replace('    dobValid &&\n    addressConfirmed &&\n    allChecksTicked &&', '    dobValid &&\n    allChecksTicked &&', 1)
          s = s.replace(
            '          address_confirmed: true,\n          date_of_birth: dob,\n          checkbox_received_read: checks.received_read,\n          checkbox_details_correct: checks.details_correct,\n          checkbox_understand_charges: checks.understand_charges,\n          checkbox_consent: checks.consent,',
            '          // One review confirmation covers document review, details/address correctness and commercial terms.\n          // We map that single explicit confirmation to the existing immutable evidence fields so the server-side\n          // acceptance gate remains fully backwards-compatible and no legal/operational check is weakened.\n          address_confirmed: reviewConfirmed,\n          date_of_birth: dob,\n          checkbox_received_read: reviewConfirmed,\n          checkbox_details_correct: reviewConfirmed,\n          checkbox_understand_charges: reviewConfirmed,\n          checkbox_consent: consentConfirmed,',
            1,
          )
          s = s.replace(
            'All four confirmations below must be ticked. Nothing is binding until you click the button at the bottom.',
            'Two clear confirmations only. Nothing is binding until you click the button at the bottom.',
            1,
          )

          ui_start_marker = '          <label className="flex items-start gap-2 text-sm border border-dashed border-foreground/40 p-3">'
          ui_end_marker = '\n\n          {!documentsReady && ('
          ui_start = s.index(ui_start_marker)
          ui_end = s.index(ui_end_marker, ui_start)
          replacement = '''          <div className="space-y-3 border-2 border-foreground/30 p-4">
            <label className="flex cursor-pointer items-start gap-3 text-sm leading-relaxed">
              <Checkbox
                checked={reviewConfirmed}
                onCheckedChange={(v) => setReviewConfirmed(v === true)}
                aria-label="Confirm contract review, details and charges"
              />
              <span>
                {REVIEW_CONFIRMATION}
                <span className="mt-1 block text-xs text-muted-foreground">
                  Service address: <strong className="text-foreground">{cs.service_address}</strong>
                </span>
              </span>
            </label>

            <label className="flex cursor-pointer items-start gap-3 border-t border-foreground/20 pt-3 text-sm leading-relaxed">
              <Checkbox
                checked={consentConfirmed}
                onCheckedChange={(v) => setConsentConfirmed(v === true)}
                aria-label="Agree to enter into the OCCTA agreement"
              />
              <span>{CONSENT_CONFIRMATION}</span>
            </label>
          </div>'''
          s = s[:ui_start] + replacement + s[ui_end:]

          for forbidden in ['addressConfirmed', 'setAddressConfirmed', 'CHECKBOXES.map', 'checks[', 'setChecks']:
              if forbidden in s:
                  raise SystemExit(f'Old signing UX reference still present: {forbidden}')
          p.write_text(s)

          p = Path('src/pages/order/OrderJourney.tsx')
          s = p.read_text()
          s = s.replace(
            'className="mx-auto w-full max-w-[1600px] px-4 py-8 sm:px-6 lg:px-8 lg:py-10"',
            'className="w-full px-4 py-8 sm:px-6 lg:px-8 lg:py-10"',
            1,
          )
          s = s.replace(
            'className="grid items-start gap-6 xl:grid-cols-[minmax(0,1fr)_360px] xl:gap-8"',
            'className="grid items-start gap-6 lg:grid-cols-[minmax(0,1fr)_minmax(300px,360px)] lg:gap-8"',
            1,
          )
          s = s.replace(
            '          <div>\n            {inSelection && activeStep === "address"',
            '          <div className="min-w-0">\n            {inSelection && activeStep === "address"',
            1,
          )
          p.write_text(s)

          p = Path('src/pages/quote/UnifiedJourney.tsx')
          s = p.read_text().replace(
            'className="container mx-auto px-4 py-10 max-w-2xl"',
            'className="container mx-auto w-full px-4 py-10 max-w-5xl"',
            1,
          )
          p.write_text(s)
          PY

          git diff --check
          git diff -- src/pages/quote/journey/AgreementStep.tsx src/pages/order/OrderJourney.tsx src/pages/quote/UnifiedJourney.tsx

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Production build
        run: npm run build

      - name: Commit and push verified production hotfix
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'OCCTA Production Hotfix'
          git config user.email 'actions@users.noreply.github.com'
          git add src/pages/quote/journey/AgreementStep.tsx src/pages/order/OrderJourney.tsx src/pages/quote/UnifiedJourney.tsx
          if git diff --cached --quiet; then
            echo 'Signing UX hotfix already present.'
            exit 0
          fi
          git commit -m 'fix(order): simplify signing consent and use full desktop width'
          git pull --rebase origin main
          git push origin HEAD:main
